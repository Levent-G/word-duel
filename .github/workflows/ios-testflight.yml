# Word Duel iOS build -> TestFlight (free: local EAS build on GitHub's macOS runner, no EAS build quota)
# Run: GitHub > Actions > "iOS TestFlight" > Run workflow
# Required secret: EXPO_TOKEN (expo.dev > Account settings > Access tokens)
# If the Actions tab is missing: Settings > Actions > General > Allow all actions, then push any commit
# (GitHub only registers workflows on a push made while Actions is enabled).
name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Expo account check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          eas whoami

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Signing credentials come from Expo (stored by the first `eas build`); the build number increments remotely.
      # Firebase settings come from the "production" profile in eas.json.
      - name: iOS build (local)
        run: eas build --platform ios --profile production --local --non-interactive --output ${{ github.workspace }}/word-duel.ipa

      - name: Upload to App Store Connect (TestFlight)
        run: eas submit --platform ios --profile production --path ${{ github.workspace }}/word-duel.ipa --non-interactive

      - name: Keep the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-duel-ipa
          path: ${{ github.workspace }}/word-duel.ipa
          if-no-files-found: ignore
          retention-days: 7
